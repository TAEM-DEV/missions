  <text x="196" y="56" font-size="15" fill="#8b949e">TAEM-DEV /</text>
  <text x="194" y="100" font-size="40" font-weight="700" fill="#e6edf3">missions</text>
  <text x="196" y="122" font-size="14" fill="#8b949e">Preflight mission reports: Go / No-Go, phase by phase</text>
