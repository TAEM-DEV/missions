<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-labelledby="t d">
  <title id="t">TAEM-DEV /missions</title>
  <desc id="d">Preflight mission reports: Go / No-Go, phase by phase</desc>
  <defs>
    <pattern id="g" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#161b22"/></pattern>
    <linearGradient id="u" x1="0" x2="1"><stop offset="0" stop-color="#3fb950"/><stop offset=".5" stop-color="#3fb950" stop-opacity=".25"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/></linearGradient>
    <radialGradient id="h" cx="10%" cy="40%" r="35%"><stop offset="0" stop-color="#3fb950" stop-opacity=".16"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .pulse{animation:pulse 2.4s ease-in-out infinite}.d1{animation-delay:.4s}.d2{animation-delay:.8s}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    .step{animation:step 3s ease-in-out infinite}@keyframes step{0%,100%{opacity:.3}20%{opacity:1}}
    .blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
    .flash{animation:flash 3.2s ease-in-out infinite}@keyframes flash{0%,40%,100%{opacity:1}45%{opacity:.2}50%{opacity:1}55%{opacity:.3}}
    .eq{transform-box:fill-box;transform-origin:bottom;animation:eq 1.4s ease-in-out infinite}.e1{animation-delay:-.4s}.e2{animation-delay:-.8s}
    @keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
    .dash{animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
    .shim{animation:shim 4s ease-in-out infinite}@keyframes shim{0%,100%{opacity:.55}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
